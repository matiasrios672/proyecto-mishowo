# MiShowo en Coolify (Docker Compose build pack).
# Coolify genera los secretos solo (variables SERVICE_PASSWORD_* / SERVICE_BASE64_*): no hay que escribir ninguno.
# Variables que se cargan a mano en Coolify (no son secretas):
#   ROOT_DOMAIN  dominio de la plataforma y base de cada negocio (slug.ROOT_DOMAIN). Hoy: mishowo.bitenv.site
#   API_HOST     dominio de la API (misma "site" que ROOT_DOMAIN para que las cookies de sesión viajen). Hoy: api.mishowo.bitenv.site
# DNS (DonWeb): un registro A comodín  *.mishowo  ->  IP del servidor  (cubre api., mail. y cada negocio) y el A de  mishowo.
# Dominios en la UI de Coolify:  frontend (3000) https://ROOT_DOMAIN   backend (4000) https://API_HOST   mailpit (8025) https://mail.ROOT_DOMAIN
# Los negocios (slug.ROOT_DOMAIN) se sirven por HTTP con la etiqueta de Traefik de abajo: un certificado comodín exige validar por DNS.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mishowo
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: mishowo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishowo"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # La bandeja con todos los mails (incluidos los links de acceso) pide usuario y clave: admin / SERVICE_PASSWORD_MAILPIT.
      MP_UI_AUTH: admin:${SERVICE_PASSWORD_MAILPIT}

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mishowo:${SERVICE_PASSWORD_POSTGRES}@db:5432/mishowo
      FRONTEND_ORIGIN: https://${ROOT_DOMAIN},http://${ROOT_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      APP_URL: https://${ROOT_DOMAIN}
      API_PUBLIC_URL: https://${API_HOST}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${SERVICE_PASSWORD_REVALIDATE}
      ADMIN_SECRET_KEY: ${SERVICE_BASE64_ADMINKEY}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: MiShowo <no-reply@mishowo.com>
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
        NEXT_PUBLIC_SITE_URL: https://${ROOT_DOMAIN}
        NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN}
        NEXT_PUBLIC_ROOT_SCHEME: http # los negocios van por http (sin certificado comodín)
        NEXT_PUBLIC_LEGAL_ENTITY: MiShowo
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:4000
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      REVALIDATE_SECRET: ${SERVICE_PASSWORD_REVALIDATE}
    labels:
      # Coolify no acepta comodines en su campo de dominios: cada negocio (slug.ROOT_DOMAIN) se enruta con esta regla propia.
      # Coolify escapa $ y no expande variables en las etiquetas: el dominio va escrito acá (si cambia ROOT_DOMAIN, cambiarlo también en esta línea).
      # Prioridad baja a propósito: api., mail. y el dominio raíz tienen rutas explícitas y tienen que ganar sobre este comodín.
      - traefik.enable=true
      - traefik.http.routers.mishowo-tenants.rule=HostRegexp(`^[a-z0-9-]+\.mishowo\.bitenv\.site`)
      - traefik.http.routers.mishowo-tenants.priority=1
      - traefik.http.routers.mishowo-tenants.entryPoints=http
      - traefik.http.routers.mishowo-tenants.service=mishowo-tenants
      - traefik.http.services.mishowo-tenants.loadbalancer.server.port=3000

volumes:
  pgdata:
  uploads:
