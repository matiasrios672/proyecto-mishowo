# Stack autónomo para un VPS de PRUEBA con dominio temporal (sslip.io) y SIN certificado: todo por HTTP, puerto 80.
# Incluye Traefik (proxy), Postgres, backend, frontend y Mailpit (los mails de prueba se leen por túnel SSH).
# Uso: ./scripts/vps-up.sh   (genera .env.vps con los secretos y levanta todo). Ver DEPLOY-VPS.md.
# Para producción real (HTTPS, wildcard, SMTP real) usá docker-compose.prod.yml con Coolify.
name: mishowo-vps

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=WARN
      - --ping=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mishowo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?corré ./scripts/vps-up.sh}
      POSTGRES_DB: mishowo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishowo"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Solo en el propio VPS: se mira con  ssh -L 8025:localhost:8025 usuario@IP  y abriendo http://localhost:8025
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    mem_limit: 128m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mishowo:${POSTGRES_PASSWORD}@db:5432/mishowo
      FRONTEND_ORIGIN: http://${ROOT_DOMAIN:?}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN-.${ROOT_DOMAIN}}
      COOKIE_SECURE: "false" # sin HTTPS la cookie "Secure" no viajaría y nadie podría iniciar sesión
      APP_URL: http://${ROOT_DOMAIN}
      API_PUBLIC_URL: http://api.${ROOT_DOMAIN}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-MiShowo <no-reply@mishowo.com>}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${ROOT_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=4000
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api.${ROOT_DOMAIN}
        NEXT_PUBLIC_SITE_URL: http://${ROOT_DOMAIN}
        NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN}
        NEXT_PUBLIC_ROOT_SCHEME: http
        NEXT_PUBLIC_LEGAL_ENTITY: ${LEGAL_ENTITY:-MiShowo}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:4000
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    labels:
      - traefik.enable=true
      # Todo lo que no sea api.<dominio> va al frontend: el dominio raíz y cada negocio (slug.<dominio>).
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    mem_limit: 512m

volumes:
  pgdata:
  uploads:
