# Desarrollo local. En la tarea 1.7 se suman backend y frontend.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mishowo
      POSTGRES_PASSWORD: mishowo
      POSTGRES_DB: mishowo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishowo"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  pgdata:
