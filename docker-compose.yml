# Desarrollo local: `docker compose up --build`
#  - frontend  http://localhost:3000
#  - backend   http://localhost:4000/api/health
#  - mailpit   http://localhost:8025 (emails de prueba)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mishowo
      POSTGRES_PASSWORD: mishowo
      POSTGRES_DB: mishowo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishowo"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mishowo:mishowo@db:5432/mishowo
      FRONTEND_ORIGIN: http://localhost:3000,http://localhost:3100
      APP_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AUTH_PER_MINUTE: "60"
      REPORTS_PER_MINUTE: "60"
      PUBLISH_PER_MINUTE: "60"
      PAYMENTS_PER_MINUTE: "60"
      ADMIN_2FA_PER_MINUTE: "60"
      # Solo desarrollo: en producción, generar con: openssl rand -base64 32
      ADMIN_SECRET_KEY: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: dev-revalidate-secret-0123456789
      UPLOADS_DIR: /app/uploads
      API_PUBLIC_URL: http://localhost:4000
      UPLOADS_PER_MINUTE: "120"
      COUPONS_VALIDATE_PER_MINUTE: "600"
      APPOINTMENTS_PER_MINUTE: "600"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:4000
      REVALIDATE_SECRET: dev-revalidate-secret-0123456789
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
