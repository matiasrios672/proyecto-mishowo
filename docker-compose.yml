# Desarrollo local: `docker compose up --build`
#  - frontend  http://localhost:3000
#  - backend   http://localhost:4000/api/health
#  - mailpit   http://localhost:8025 (emails de prueba)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mishowo
      POSTGRES_PASSWORD: mishowo
      POSTGRES_DB: mishowo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishowo"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mishowo:mishowo@db:5432/mishowo
      FRONTEND_ORIGIN: http://localhost:3000
      UPLOADS_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
